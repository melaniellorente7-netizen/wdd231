<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#123F68"/>
    </linearGradient>
    <clipPath id="banner-round">
      <rect x="0" y="0" width="1600" height="500" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-round)">
    <!-- Fondo -->
    <rect width="1600" height="500" fill="url(#skyGrad)"/>

    <!-- Sol / acento terracota -->
    <circle cx="1370" cy="120" r="130" fill="#C04A21" opacity="0.9"/>
    <circle cx="1370" cy="120" r="130" fill="none" stroke="#F4F1EA" stroke-width="1.5" opacity="0.3"/>

    <!-- Estrellas / puntos decorativos -->
    <g fill="#F4F1EA" opacity="0.35">
      <circle cx="120" cy="70" r="2"/>
      <circle cx="220" cy="140" r="1.5"/>
      <circle cx="90" cy="220" r="2"/>
      <circle cx="330" cy="60" r="1.5"/>
      <circle cx="500" cy="90" r="2"/>
      <circle cx="620" cy="40" r="1.5"/>
    </g>

    <!-- Ruta de vuelo punteada -->
    <path d="M 560 400 Q 900 280 1050 330 T 1650 220"
          fill="none" stroke="#F4F1EA" stroke-width="2.5"
          stroke-dasharray="3 10" stroke-linecap="round" opacity="0.6"/>

    <!-- Avion de papel siguiendo la ruta -->
    <g transform="translate(1050,330) rotate(-8)">
      <path d="M0 0 L34 12 L0 24 L8 12 Z" fill="#F4F1EA" stroke="#0F4C81" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 0 L8 12 L0 24" fill="#C04A21" stroke="#0F4C81" stroke-width="1" stroke-linejoin="round"/>
    </g>

    <!-- Colina / franja de arena en la parte inferior -->
    <path d="M0 500 L0 430 Q 400 370 800 430 T 1600 400 L1600 500 Z" fill="#F4F1EA" opacity="0.95"/>

    <!-- Silueta de montanas sobre la franja de arena -->
    <g fill="#0F4C81" opacity="0.15">
      <path d="M150 430 L230 350 L300 430 Z"/>
      <path d="M280 430 L370 320 L460 430 Z"/>
      <path d="M1150 420 L1230 340 L1310 420 Z"/>
      <path d="M1280 420 L1370 330 L1460 420 Z"/>
    </g>

    <!-- Viajero 1: mochilero mirando el horizonte -->
    <g transform="translate(660,300)">
      <ellipse cx="0" cy="128" rx="34" ry="7" fill="#0F4C81" opacity="0.25"/>
      <path d="M-6 78 L-14 126 L-2 126 L6 84 Z" fill="#C04A21"/>
      <path d="M8 80 L18 124 L30 124 L18 78 Z" fill="#A8391A"/>
      <path d="M-16 28 Q -20 60 -10 82 L 22 82 Q 30 56 20 26 Q 4 14 -16 28 Z" fill="#F4F1EA"/>
      <rect x="-30" y="30" width="20" height="40" rx="6" fill="#C04A21" stroke="#0F4C81" stroke-width="1.5"/>
      <rect x="-26" y="24" width="12" height="12" rx="4" fill="#C04A21" stroke="#0F4C81" stroke-width="1.5"/>
      <path d="M18 34 Q 34 40 36 56" fill="none" stroke="#F4F1EA" stroke-width="9" stroke-linecap="round"/>
      <line x1="38" y1="54" x2="46" y2="126" stroke="#0F4C81" stroke-width="3" stroke-linecap="round"/>
      <circle cx="4" cy="10" r="16" fill="#E8B090"/>
      <path d="M-16 4 Q 4 -14 24 4 Q 12 -2 4 -2 Q -6 -2 -16 4 Z" fill="#0F4C81"/>
      <ellipse cx="4" cy="4" rx="22" ry="5" fill="#0F4C81"/>
    </g>

    <!-- Viajero 2: con maleta de ruedas -->
    <g transform="translate(1010,322)">
      <ellipse cx="0" cy="108" rx="40" ry="7" fill="#0F4C81" opacity="0.25"/>
      <path d="M-4 66 L-16 106 L-4 106 L2 70 Z" fill="#0F4C81"/>
      <path d="M6 68 L18 104 L30 104 L16 66 Z" fill="#123F68"/>
      <path d="M-14 22 Q -18 50 -8 70 L 16 70 Q 24 48 14 20 Q 0 10 -14 22 Z" fill="#C04A21"/>
      <path d="M14 30 Q 30 38 34 54" fill="none" stroke="#C04A21" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="6" r="14" fill="#E8B090"/>
      <path d="M-14 2 Q -14 -14 0 -14 Q 14 -14 14 2 Q 14 10 10 14 Q 12 -4 0 -4 Q -12 -4 -10 14 Q -14 10 -14 2 Z" fill="#1C2833"/>
      <rect x="30" y="54" width="26" height="34" rx="4" fill="#F4F1EA" stroke="#0F4C81" stroke-width="2"/>
      <line x1="30" y1="64" x2="56" y2="64" stroke="#0F4C81" stroke-width="1.5"/>
      <rect x="40" y="46" width="6" height="10" rx="2" fill="#0F4C81"/>
      <circle cx="36" cy="90" r="3" fill="#0F4C81"/>
      <circle cx="50" cy="90" r="3" fill="#0F4C81"/>
    </g>

    <!-- Camara fotografica flotante -->
    <g transform="translate(900,370) rotate(8)">
      <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#F4F1EA" stroke="#0F4C81" stroke-width="2"/>
      <rect x="-6" y="-18" width="14" height="8" rx="2" fill="#F4F1EA" stroke="#0F4C81" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#0F4C81"/>
      <circle cx="0" cy="0" r="4" fill="#C04A21"/>
    </g>

    <!-- Titulo principal -->
    <text x="120" y="240" font-family="Geomini ExtraLight ExtraBold, Geomini, sans-serif" font-size="88" font-weight="800" fill="#F4F1EA">
      Traveler's Guide
    </text>

    <!-- Subrayado decorativo -->
    <rect x="122" y="262" width="360" height="5" fill="#C04A21" rx="2"/>

    <!-- Tagline -->
    <text x="122" y="310" font-family="Geomini ExtraLight, Geomini, sans-serif" font-size="30" fill="#F4F1EA" opacity="0.9">
      Explore the world. Check the weather. Save your journey.
    </text>
  </g>
</svg>
