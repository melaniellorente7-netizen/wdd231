<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Melanie Llorente">
    <meta name="description" content="Online guide with tips of a variety of destinations for travelers">
    <title>Traveler's Guide</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geomini:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>

</head>

<body>
    <header>
        <img src="images/logo-header.png" alt="Traveler's Guide Earth Logo" width="512" height="512">
        <span>Traveler's Guide</span>
        <button id="ham-btn" class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false"
            aria-controls="nav-bar"></button>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li class="current"><a href="guides.html">Guides</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="filter-container">
            <input type="text" id="search-input" placeholder="Search by country or region..." />

            <select id="region-filter">
                <option value="all">All Regions</option>
            </select>

            <button id="saved-filter-btn" class="filter-btn">
                ⭐ Saved (<span id="saved-count">0</span>)
            </button>
        </section>
        <section id="countries-grid" class="countries-grid"></section>
        <dialog id="country-dialog" class="country-modal">
            <div class="modal-content">
                <button id="close-dialog" class="close-btn" aria-label="Close dialog">&times;</button>
                <h2 id="modal-country-name">Country Name</h2>

                <div class="modal-body">
                    <h3>Travel Tips</h3>

                    <div class="tip-item">
                        <strong>Best Season to travel:</strong>
                        <span id="tip-season">--</span>
                    </div>

                    <div class="tip-item">
                        <strong>Travel Style:</strong>
                        <span id="tip-style">--</span>
                    </div>

                    <div class="tip-item">
                        <strong>Cultural Tip:</strong>
                        <p id="tip-cultural">--</p>
                    </div>
                </div>
            </div>
        </dialog>

    </main>
    <footer>
        <p>©<span id="currentyear"></span> Melanie Llorente - Final WDD 231 Project</p>
        <p id="lastModified"></p>
    </footer>
    <script type="module" src="scripts/countries.js"></script>
</body>

</html>
